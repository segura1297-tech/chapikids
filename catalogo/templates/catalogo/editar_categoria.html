{% extends 'catalogo/base.html' %}

{% block title %}Editar Categoría - Chapikids Piñatas{% endblock %}

{% block content %}
<div class="form-container">
    <h1 class="page-title">✏️ Editar Categoría</h1>

    <form method="post" class="product-form">
        {% csrf_token %}

        <div class="form-group">
            <label for="nombre">Nombre de la categoría *</label>
            <input type="text" id="nombre" name="nombre" required class="form-input" value="{{ categoria.nombre }}">
        </div>

        <div class="form-group">
            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" name="descripcion" rows="3" class="form-input">{{ categoria.descripcion }}</textarea>
        </div>

        <div class="form-group">
            <label for="orden">Orden de visualización</label>
            <input type="number" id="orden" name="orden" class="form-input" value="{{ categoria.orden }}" min="0">
            <small class="form-help">Número para ordenar las categorías (menor = primero)</small>
        </div>

        <div class="form-group checkbox-group">
            <label class="checkbox-label">
                <input type="checkbox" name="activa" {% if categoria.activa %}checked{% endif %}>
                <span>Categoría activa</span>
            </label>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-large">💾 Guardar Cambios</button>
            <a href="{% url 'catalogo:gestion_categorias' %}" class="btn btn-secondary">← Volver</a>
        </div>
    </form>
</div>
{% endblock %}
