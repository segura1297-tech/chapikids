{% extends 'catalogo/base.html' %}

{% block title %}Crear Categoría - Chapikids Piñatas{% endblock %}

{% block content %}
<div class="form-container">
    <h1 class="page-title">➕ Nueva Categoría</h1>

    <form method="post" class="product-form">
        {% csrf_token %}

        <div class="form-group">
            <label for="nombre">Nombre de la categoría *</label>
            <input type="text" id="nombre" name="nombre" required class="form-input" placeholder="Ej: Superhéroes">
        </div>

        <div class="form-group">
            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" name="descripcion" rows="3" class="form-input" placeholder="Describe la categoría..."></textarea>
        </div>

        <div class="form-group">
            <label for="orden">Orden de visualización</label>
            <input type="number" id="orden" name="orden" class="form-input" value="0" min="0">
            <small class="form-help">Número para ordenar las categorías (menor = primero)</small>
        </div>

        <div class="form-group checkbox-group">
            <label class="checkbox-label">
                <input type="checkbox" name="activa" checked>
                <span>Categoría activa</span>
            </label>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-large">💾 Guardar Categoría</button>
            <a href="{% url 'catalogo:gestion_categorias' %}" class="btn btn-secondary">← Volver</a>
        </div>
    </form>
</div>
{% endblock %}
