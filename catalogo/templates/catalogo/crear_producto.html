{% extends 'catalogo/base.html' %}

{% block title %}Crear Producto - Chapikids Piñatas{% endblock %}

{% block content %}
<div class="form-container">
    <h1 class="page-title">➕ Nuevo Producto</h1>

    <form method="post" enctype="multipart/form-data" class="product-form">
        {% csrf_token %}

        <div class="form-group">
            <label for="nombre">Nombre del producto *</label>
            <input type="text" id="nombre" name="nombre" required class="form-input" placeholder="Ej: Piñata de Unicornio">
        </div>

        <div class="form-group">
            <label for="categoria">Categoría *</label>
            <select id="categoria" name="categoria" required class="form-input">
                <option value="">Selecciona una categoría</option>
                {% for categoria in categorias %}
                    <option value="{{ categoria.id }}">{{ categoria.nombre }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="precio">Precio (MXN) *</label>
            <input type="number" id="precio" name="precio" required class="form-input" placeholder="Ej: 350.00" step="0.01" min="0">
        </div>

        <div class="form-group">
            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" name="descripcion" rows="4" class="form-input" placeholder="Describe el producto..."></textarea>
        </div>

        <div class="form-group">
            <label for="foto">Foto del producto</label>
            <input type="file" id="foto" name="foto" accept="image/*" class="form-input file-input">
            <small class="form-help">Formatos: JPG, PNG. Tamaño máximo: 5MB</small>
        </div>

        <div class="form-group checkbox-group">
            <label class="checkbox-label">
                <input type="checkbox" name="disponible" checked>
                <span>Disponible para venta</span>
            </label>
        </div>

        <div class="form-group checkbox-group">
            <label class="checkbox-label">
                <input type="checkbox" name="destacado">
                <span>Producto destacado</span>
            </label>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-large">💾 Guardar Producto</button>
            <a href="{% url 'catalogo:gestion_productos' %}" class="btn btn-secondary">← Volver</a>
        </div>
    </form>
</div>
{% endblock %}
